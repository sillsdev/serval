apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: serval-api
  name: serval-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serval-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: serval-api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          command: ["sh", "-c", "chown -R 1654:1654 /var/lib/machine /var/lib/serval /home/app/.aspnet/DataProtection-Keys"]
          volumeMounts:
            - mountPath: /var/lib/machine
              name: machine-mount
            - mountPath: /var/lib/serval
              name: serval-mount
            - mountPath: /home/app/.aspnet/DataProtection-Keys
              name: server-keys
      containers:
        - command:
            - dotnet
            - /app/api_server/Serval.ApiServer.dll
          workingDir: /app/api_server
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: Auth__Domain
              value: {{ .Values.auth0Domain}}
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.environment}}
            - name: ASPNETCORE_DeploymentVersion
              value: {{ default "undefined" .Values.deploymentVersion}}
            - name: ASPNETCORE_Kestrel__Endpoints__Http__Url
              value: http://*:8080
            - name: ASPNETCORE_Kestrel__Endpoints__Http2__Url
              value: http://*:8081
            - name: ASPNETCORE_Kestrel__Endpoints__Http2__Protocols
              value: Http2
              {{- template "secrets.mongodb" . }}
            - name: ASPNETCORE_ConnectionStrings__Mongo
              value: $(mongodb_connection)serval
            - name: Bugsnag__ReleaseStage
              value: {{ .Values.bugsnagReleaseStage}}
              {{- template "secrets.clearml" . }}
              {{- template "secrets.s3" . }}
          image: {{ .Values.servalImage}}
          imagePullPolicy: "Always"
          name: serval-api
          ports:
            - containerPort: 8080
            - containerPort: 8081
          resources:
            limits:
              memory: "8Gi"
              cpu: "1.5"
            requests:
              memory: "8Gi"
              cpu: "1.5"
          volumeMounts:
            - mountPath: /var/lib/machine
              name: machine-mount
            - mountPath: /var/lib/serval
              name: serval-mount
            - mountPath: /home/app/.aspnet/DataProtection-Keys
              name: server-keys
      hostname: serval-api
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 208.67.222.222
      restartPolicy: Always
      volumes:
        - name: machine-mount
          persistentVolumeClaim:
            claimName: machine-claim
        - name: serval-mount
          persistentVolumeClaim:
            claimName: serval-claim
        - name: server-keys
          persistentVolumeClaim:
            claimName: keys-claim
status: {}