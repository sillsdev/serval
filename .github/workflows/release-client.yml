name: Release Serval.Client package

on:
  push:
    tags:
      - "client_*"

jobs:
  create_package:
    name: Create NuGet package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: dotnet pack src/Serval/src/Serval.Client/Serval.Client.csproj -c Release -o artifacts
      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: nuget-package
          path: artifacts/*.nupkg

  publish:
    name: Publish NuGet package
    needs: create_package
    runs-on: ubuntu-latest
    # The nuget.org policy trusts only the nuget environment, which accepts client_* tags alone.
    environment: nuget
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: nuget-package
          path: artifacts
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" -n -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
